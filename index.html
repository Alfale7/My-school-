<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>صرح اليرموك الرقمي -  </title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-glow: #1e3a8a; /* كحلي حي ومشرق */
            --accent-gold: #c5a059;  /* ذهبي ملكي فاتح */
            --bg-dark: #020617;     /* خلفية عميقة وأنيقة */
            --card-light: #f8fafc;  /* أبيض مريح للعين */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% -20%, #2563eb, transparent 60%),
                              radial-gradient(circle at 10% 90%, #1e3a8a, transparent 40%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            overflow: hidden;
        }

        /* هيدر عصري ومشرق */
        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border-bottom: 2px solid var(--accent-gold);
        }

        .logo-area { display: flex; align-items: center; gap: 10px; color: var(--accent-gold); font-weight: bold; }
        .logo-area img { height: 45px; filter: brightness(0) invert(1); }

        /* لوحة التحكم التفاعلية */
        .dashboard {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
        }

        /* كرت الترحيب الفاخر */
        .welcome-card {
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.9), rgba(37, 99, 235, 0.7));
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        .welcome-card::after {
            content: "🏛️";
            position: absolute;
            top: -10px; left: -10px;
            font-size: 5rem;
            opacity: 0.1;
        }

        .welcome-card h1 { font-size: 1.8rem; margin-bottom: 8px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .welcome-card p { font-size: 0.9rem; color: #e2e8f0; line-height: 1.5; }

        /* منطقة الإحصائيات المضيئة */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-item {
            background: var(--card-light);
            padding: 25px 15px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: 0.3s;
            border-top: 5px solid var(--accent-gold);
        }

        .stat-item .value { font-size: 2.2rem; font-weight: 800; color: var(--primary-glow); display: block; }
        .stat-item .label { font-size: 0.85rem; color: #64748b; font-weight: bold; }

        /* الزر التفاعلي المضيء */
        .cta-button {
            background: linear-gradient(90deg, #b89535, #d4af37);
            color: #1a2a6c;
            padding: 18px;
            border-radius: 15px;
            text-align: center;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 5px 20px rgba(184, 149, 53, 0.4);
            transition: 0.3s;
        }

        .cta-button:active { transform: scale(0.95); }

        /* شريط التنقل السفلي */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .nav-link {
            text-decoration: none;
            color: #94a3b8;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .nav-link.active { color: var(--accent-gold); }
        .nav-link span { font-size: 1.3rem; }

        footer {
            background: #020617;
            padding-bottom: 10px;
            text-align: center;
        }

        .counter-container { transform: scale(0.7); margin: 5px auto; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">🏛️ <span>مدرسة اليرموك الثانوية</span></div>
        <div class="logo-area"><img src="logo.png" alt="وزارة التعليم"></div>
    </header>

    <main class="dashboard">
        <!-- الترحيب -->
        <div class="welcome-card">
            <h1>صرح اليرموك الرقمي</h1>
            <p>مرحباً بك في المنصة الرسمية للابتكارات التعليمية والتقنية بمدرسة اليرموك</p>
        </div>

        <!-- الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-item">
                <span class="value">+15</span>
                <span class="label">مشروع رقمي</span>
            </div>
            <div class="stat-item">
                <span class="value">+500</span>
                <span class="label">زائر ومستفيد</span>
            </div>
        </div>

        <!-- الزر الرئيسي -->
        <a href="works.html" class="cta-button">
            🚀 تصفح معرض الأعمال
        </a>
    </main>

    <nav class="nav-bar">
        <a href="index.html" class="nav-link active"><span>🏠</span>الرئيسية</a>
        <a href="about.html" class="nav-link"><span>ℹ️</span>عن الصرح</a>
        <a href="works.html" class="nav-link"><span>📂</span>الأعمال</a>
        <a href="contact.html" class="nav-link"><span>📞</span>اتصل بنا</a>
    </nav>

    <footer>
        <p style="font-size: 0.7rem; color: #64748b; margin-top: 5px;">جميع الحقوق محفوظة &copy; 2026 - صرح اليرموك الرقمي</p>
        <div class="counter-container">
            <div id="sfc8nrj13xs4up3sn4r725pzb8pnzemeaug"></div>
            <script type="text/javascript" src="https://counter1.optistats.ovh/private/counter.js?c=8nrj13xs4up3sn4r725pzb8pnzemeaug&down=async" async></script>
        </div>
    </footer>

</body>
</html>
