<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسة اليرموك - اتصل بنا</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a2a6c;
            --accent-color: #b89535;
            --bg-light: #f8f9fa;
            --white: #ffffff;
            --text-dark: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary-color);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 3px solid var(--accent-color);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 15px;
            justify-content: center;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--white);
            font-size: 0.95rem;
            padding: 4px 8px;
            transition: 0.3s;
        }

        nav ul li a.active {
            color: var(--accent-color);
        }

        .contact-container {
            padding: 50px 20px;
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .contact-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .contact-info h3 {
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .info-icon { font-size: 1.5rem; color: var(--accent-color); }

        .info-text p { color: var(--text-dark); font-size: 0.95rem; font-weight: bold; }
        .info-text span { color: #777; font-size: 0.85rem; }

        .contact-form { display: flex; flex-direction: column; gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.9rem; color: var(--primary-color); font-weight: bold; }
        .form-group input, .form-group textarea {
            padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover { background-color: var(--accent-color); }

        footer {
            background-color: var(--primary-color);
            color: var(--white);
            text-align: center;
            padding: 20px;
            border-top: 3px solid var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🏛️ مدرسة اليرموك الثانوية</div>
        <nav>
            <ul>
                <!-- تم تحديث الروابط وربط ملف works.html -->
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="about.html">عن المدرسة</a></li>
                <li><a href="services.html">الخدمات</a></li>
                <li><a href="works.html">أعمالنا الرقمية</a></li>
                <li><a href="contact.html" class="active">اتصل بنا</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-container">
        <div style="text-align: center; margin-bottom: 40px;">
            <h2 style="color: var(--primary-color); font-size: 2rem;">تواصل معنا</h2>
            <div style="width: 50px; height: 3px; background: var(--accent-color); margin: 10px auto;"></div>
        </div>

        <div class="contact-wrapper">
            <div class="contact-info">
                <h3>بيانات التواصل الرسمي</h3>
                
                <div class="info-item">
                    <span class="info-icon">📧</span>
                    <div class="info-text">
                        <span>البريد الإلكتروني الرسمي</span>
                        <p style="direction: ltr; text-align: right;">842225@jb.moe.gov.sa</p>
                    </div>
                </div>

                <div class="info-item">
                    <span class="info-icon">📍</span>
                    <div class="info-text">
                        <span>العنوان</span>
                        <p>الجوف - سكاكا</p>
                    </div>
                </div>
            </div>

            <form class="contact-form">
                <div class="form-group">
                    <label>الاسم</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>الرسالة</label>
                    <textarea rows="4" required></textarea>
                </div>
                <button type="submit" class="submit-btn">إرسال الاستفسار</button>
            </form>
        </div>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - مدرسة اليرموك الثانوية</p>
    </footer>

</body>
</html>
