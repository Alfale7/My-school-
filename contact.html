<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مركز التواصل - الصرح الرقمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-glow: #1e3a8a;
            --accent-gold: #c5a059;
            --bg-dark: #020617;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-dark); 
            background-image: radial-gradient(circle at 50% 20%, #1e40af, var(--bg-dark) 80%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* هيدر ونافيجيشن موحد */
        header { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px); padding: 1rem 1.5rem; border-bottom: 2px solid var(--accent-gold); z-index: 100; }
        .header-content { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .school-logo { font-size: 1.1rem; font-weight: 700; color: var(--accent-gold); }
        .ministry-logo img { height: 45px; filter: brightness(0) invert(1); }
        nav { background: rgba(0,0,0,0.3); padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        nav ul { display: flex; list-style: none; gap: 20px; justify-content: center; }
        nav ul li a { text-decoration: none; color: white; font-size: 0.85rem; opacity: 0.7; }
        nav ul li a.active { color: var(--accent-gold); font-weight: bold; opacity: 1; }

        /* --- رادار التواصل الإبداعي --- */
        .contact-orbit {
            position: relative;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .center-hub {
            text-align: center;
            z-index: 5;
            background: var(--glass);
            padding: 18px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.2);
            animation: pulse-gold 3s infinite;
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0px var(--accent-gold); }
            50% { box-shadow: 0 0 25px var(--accent-gold); }
            100% { box-shadow: 0 0 0px var(--accent-gold); }
        }

        .orbit-item {
            position: absolute;
            width: 65px;
            height: 65px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            transition: 0.4s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .orbit-item:hover { transform: scale(1.15); border-color: var(--accent-gold); background: rgba(197, 160, 89, 0.1); }

        .item-1 { transform: translate(-90px, -60px); }
        .item-2 { transform: translate(90px, -60px); }
        .item-3 { transform: translate(-90px, 60px); }
        .item-4 { transform: translate(90px, 60px); }

        .orbit-item .icon { font-size: 1.4rem; }
        .orbit-item .label { font-size: 0.6rem; color: var(--accent-gold); font-weight: bold; margin-top: 3px; }

        /* --- إطار النموذج الثابت (بدون سكرول) --- */
        .form-section {
            padding: 0 15px 40px;
            display: flex;
            justify-content: center;
        }

        .form-glass-card {
            width: 100%;
            max-width: 800px;
            background: rgba(255,255,255,0.02);
            border-radius: 25px;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden; /* لمنع السكرول المزدوج */
        }

        .form-glass-card::before {
            content: "ارسل رسالتك";
            position: absolute;
            top: -12px; right: 25px;
            background: var(--accent-gold);
            color: var(--primary-glow);
            padding: 2px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            z-index: 10;
        }

        iframe {
            width: 100%;
            height: 850px; /* الارتفاع الكافي لعرض النموذج كاملاً */
            border-radius: 18px;
            border: none;
            background: white;
            display: block;
        }

        footer { background: #020617; padding: 20px; text-align: center; border-top: 1px solid var(--accent-gold); }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="school-logo">🏛️ <span>مدرسة اليرموك الثانوية</span></div>
            <div class="ministry-logo"><img src="logo.png" alt="وزارة التعليم"></div>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="about.html">عن الصرح</a></li>
            <li><a href="works.html">أعمالنا</a></li>
            <li><a href="contact.html" class="active">اتصل بنا</a></li>
        </ul>
    </nav>

    <main>
        <section class="contact-orbit">
            <div class="center-hub">
                <h2 style="font-size: 1.1rem;">مركز<br>التواصل</h2>
            </div>

            <a href="https://maps.app.goo.gl/YFbrvq2e7AZ667y39" target="_blank" class="orbit-item item-1">
                <span class="icon">📍</span><span class="label">الموقع</span>
            </a>
            <a href="https://www.chatbase.co/chatbot-iframe/_gApu7rnjCHxPJVhTKlnR" target="_blank" class="orbit-item item-2">
                <span class="icon">🤖</span><span class="label">المساعد</span>
            </a>
            <a href="https://youtube.com/@alyarmoukschool" target="_blank" class="orbit-item item-3">
                <span class="icon">🎬</span><span class="label">يوتيوب</span>
            </a>
            <a href="mailto:842225@jb.moe.gov.sa" class="orbit-item item-4">
                <span class="icon">📧</span><span class="label">البريد</span>
            </a>
        </section>

        <section class="form-section">
            <div class="form-glass-card">
                <!-- الارتفاع هنا يضمن ظهور كامل النموذج دون سكرول داخلي -->
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSd08wuMrzNQld3xMKTaMAtVU587_hrabzBr0qVDihIE7Mb4jA/viewform?embedded=true">
                    جاري التحميل...
                </iframe>
            </div>
        </section>
    </main>

    <footer>
        <p style="font-size: 0.7rem; color: #64748b;">جميع الحقوق محفوظة © 2026 - صرح اليرموك الرقمي</p>
    </footer>

</body>
</html>
